name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_USER_HOME: /home/runner/.gradle

jobs:
  verify:
    name: Tests, credential scan and builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Android SDK platform 36
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          else
            sdkmanager "platforms;android-36"
          fi

      - name: Agent check (diff validation, credential scan, shared tests)
        run: ./scripts/agent-check.sh

      - name: Build debug APK and compile iOS sources
        run: ./gradlew :androidApp:assembleDebug :shared:compileTestKotlinIosSimulatorArm64 --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: academy-client-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
